services:
  agent:
    build: .
    restart: always
    env_file: .env
    environment:
      AGENT_VERSION: ${AGENT_VERSION:-dev}
    volumes:
      - data:/data

  # Read-only view of the agent's data, so the panel can change without restarting the agent.
  panel:
    build: .
    restart: always
    env_file: .env
    environment:
      READ_ONLY: "1"
    volumes:
      - data:/data:ro

  # Public demo for judges: practice-bench runs against the practice desktop, own data, capped runs.
  demo:
    build: .
    restart: always
    # demo.env holds the practice desktop's URL, password and token; only this service gets them.
    env_file: [.env, demo.env]
    environment:
      AGENT_VERSION: ${DEMO_VERSION:-dev}
      DEMO_MAX_RUNS: "25"
    volumes:
      - demo-data:/data

  caddy:
    image: caddy:2.8
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:?AGENT_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  data:
  demo-data:
  caddy:
